<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>아리사에게 편지를 남겨주세요 · ARISA LAST LIVE</title>
  <meta name="theme-color" content="#F5C9D9" />
  <meta name="robots" content="noindex, nofollow" />
  <!-- 편지 쓰기 페이지의 주소가 이 화면의 주소와 다를 때만 아래 content 에 적으세요. 비워 두면 이 서비스의 첫 화면 주소가 QR 로 만들어져요. -->
  <meta name="arisa-write-url" content="" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/assets/arisa-theme.css" />
  <link rel="stylesheet" href="/assets/letterbox.css" />
  <script type="module" src="/assets/display.js"></script>
</head>
<body class="arisa-theme">
  <div class="arisa-stage" aria-hidden="true"><span class="arisa-stage__drift"></span></div>
  <div class="emoji-layer" id="emoji-layer" aria-hidden="true"></div>

  <main class="dp-root">
    <p class="eyebrow dp-eyebrow">ARISA · LAST LIVE</p>
    <h1 class="dp-title">아리사에게 편지를 남겨주세요</h1>
    <div class="dp-qr" id="qr"></div>
    <p class="dp-sub">카메라로 QR 코드를 비추면 편지 쓰기 페이지가 열려요.</p>
    <p class="dp-sub" lang="ja">QRコードをカメラで読み取ると、手紙を書くページが開きます。</p>
    <p class="dp-url" id="qr-url"></p>
  </main>

  <div class="dp-fullscreen">
    <button type="button" class="chip-btn" id="motion-btn">움직임 끄기</button>
    <button type="button" class="chip-btn" id="fullscreen-btn">전체화면</button>
  </div>

  <noscript>
    <p class="noscript-note">QR 코드를 보려면 JavaScript가 켜져 있어야 해요.</p>
  </noscript>
</body>
</html>
